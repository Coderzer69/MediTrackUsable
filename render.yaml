# Render Blueprint for the MediTrack monorepo.
# Three services built from this one repository:
#   meditrack-api    Express + Prisma backend (Backend/)
#   meditrack-web    Main React app (frontend/)
#   meditrack-admin  Admin portal (admin/)
# The database is the existing Neon Postgres (set DATABASE_URL on meditrack-api).
# Secrets are marked sync: false and are entered in Render, never committed.
# Note: Render adds the Blueprint's suffix ("-k2xy") to each name below, so the
# live services are meditrack-api-k2xy-k2xy, meditrack-web-k2xy-k2xy and
# meditrack-admin-k2xy-k2xy. Do not rename these entries: renaming creates new services.

services:
  - type: web
    name: meditrack-api-k2xy
    runtime: node
    # Starter: always on (no cold starts on the free plan's 15-min sleep).
    plan: starter
    region: ohio
    rootDir: Backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        value: https://meditrack-web-k2xy-k2xy.onrender.com,https://meditrack-admin-k2xy-k2xy.onrender.com
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Prescription emails (Brevo). BREVO_API_KEY and EMAIL_FROM_ADDRESS are
      # set on the service in the Render dashboard (kept out of this file).
      # ElevenLabs (doctor dictation + patient voice): ELEVENLABS_API_KEY is also
      # set in the dashboard. Optional: ELEVENLABS_STT_MODEL, ELEVENLABS_TTS_MODEL,
      # ELEVENLABS_VOICE_ID.
      - key: EMAIL_FROM_NAME
        value: MediTrack
      - key: APP_URL
        value: https://meditrack-web-k2xy-k2xy.onrender.com

  - type: web
    runtime: static
    name: meditrack-web-k2xy
    rootDir: frontend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://meditrack-api-k2xy-k2xy.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    runtime: static
    name: meditrack-admin-k2xy
    rootDir: admin
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://meditrack-api-k2xy-k2xy.onrender.com/api
